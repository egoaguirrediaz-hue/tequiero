<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#020207">

    <title>Nuestro pequeño universo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =====================================================
         INTRO
    ====================================================== -->

    <section id="intro" class="intro">

        <div class="space"></div>

        <div id="stars"></div>

        <div class="nebula nebula-one"></div>
        <div class="nebula nebula-two"></div>

        <div class="intro-content">

            <div class="intro-star">✦</div>

            <p class="eyebrow">
                PARA TI
            </p>

            <h1>
                Hay lugares que<br>
                no aparecen en ningún mapa...
            </h1>

            <p class="subtitle">
                pero existen cuando estás con la persona correcta.
            </p>

            <div class="reveal">

                <span class="reveal-line"></span>

                <p>
                    Y yo encontré el mío.
                </p>

                <strong>
                    Tú.
                </strong>

            </div>

            <button id="enterButton" class="enter-button">
                <span>Entrar al universo</span>
                <b>✦</b>
            </button>

        </div>

        <div class="bottom-hint">

            <span class="hint-line"></span>

            <span>
                toca para comenzar
            </span>

        </div>

    </section>


    <!-- =====================================================
         UNIVERSO
    ====================================================== -->

    <main id="universe" class="universe">

        <div class="universe-stars" id="universeStars"></div>

        <div class="universe-nebula nebula-purple"></div>
        <div class="universe-nebula nebula-pink"></div>

        <!-- órbitas -->

        <div class="orbit orbit-1"></div>
        <div class="orbit orbit-2"></div>
        <div class="orbit orbit-3"></div>


        <!-- =================================================
             NÚCLEO
        ================================================== -->

        <button
            class="core"
            data-section="nosotros"
            aria-label="Nosotros"
        >

            <div class="core-glow"></div>

            <div class="core-symbol">
                ♥
            </div>

            <span>
                nosotros
            </span>

        </button>


        <!-- =================================================
             PLANETA 1
        ================================================== -->

        <button
            class="planet planet-you"
            data-section="tu"
            aria-label="Tú"
        >

            <span class="planet-ring"></span>

            <span class="planet-body">
                ☾
            </span>

            <span class="planet-label">
                tú
            </span>

        </button>


        <!-- =================================================
             PLANETA 2
        ================================================== -->

        <button
            class="planet planet-effect"
            data-section="provocas"
            aria-label="Lo que provocas"
        >

            <span class="planet-ring"></span>

            <span class="planet-body">
                ✦
            </span>

            <span class="planet-label">
                lo que provocas
            </span>

        </button>


        <!-- =================================================
             PLANETA 3
        ================================================== -->

        <button
            class="planet planet-world"
            data-section="mundo"
            aria-label="Nuestro mundo"
        >

            <span class="planet-ring"></span>

            <span class="planet-body">
                ◉
            </span>

            <span class="planet-label">
                nuestro mundo
            </span>

        </button>


        <!-- =================================================
             PLANETA 4
        ================================================== -->

        <button
            class="planet planet-future"
            data-section="futuro"
            aria-label="Lo que todavía no vivimos"
        >

            <span class="planet-ring"></span>

            <span class="planet-body">
                ♡
            </span>

            <span class="planet-label">
                lo que falta vivir
            </span>

        </button>


        <!-- =================================================
             INDICACIÓN
        ================================================== -->

        <div class="universe-message">

            <span>
                explora
            </span>

            <div class="message-line"></div>

            <small>
                toca una estrella
            </small>

        </div>


        <!-- =================================================
             PANEL DE EXPLORACIÓN
        ================================================== -->

        <section
            id="explorePanel"
            class="explore-panel"
        >

            <button
                id="closePanel"
                class="close-panel"
                aria-label="Cerrar"
            >
                ×
            </button>

            <div class="panel-star">
                ✦
            </div>

            <p
                id="panelEyebrow"
                class="panel-eyebrow"
            >
                nuestro universo
            </p>

            <h2 id="panelTitle">
                Nosotros
            </h2>

            <div class="panel-divider"></div>

            <p
                id="panelText"
                class="panel-text"
            >
                Aquí comienza todo.
            </p>

            <button
                id="panelContinue"
                class="panel-continue"
            >
                seguir explorando
                <span>→</span>
            </button>

        </section>


        <!-- =================================================
             TRANSICIÓN
        ================================================== -->

        <div
            id="warp"
            class="warp"
        ></div>

    </main>


    <!-- =====================================================
         MÚSICA
    ====================================================== -->

    <audio
        id="backgroundMusic"
        loop
        preload="auto"
    >

        <source
            src="assets/music/our-song.mp3"
            type="audio/mpeg"
        >

    </audio>


    <script src="js/app.js"></script>

</body>
</html>
