<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#020207">

    <title>Nuestro pequeño universo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =====================================================
         BLOQUE 1 — INTRO
    ====================================================== -->

    <section id="intro" class="intro">

        <!-- Fondo -->
        <div class="space"></div>

        <!-- Estrellas -->
        <div id="stars"></div>

        <!-- Nebulosas -->
        <div class="nebula nebula-one"></div>
        <div class="nebula nebula-two"></div>

        <!-- Contenido -->
        <div class="intro-content">

            <div class="intro-star">
                ✦
            </div>

            <p class="eyebrow">
                PARA TI
            </p>

            <h1 id="introTitle">
                Hay lugares que<br>
                no aparecen en ningún mapa...
            </h1>

            <p id="introSubtitle" class="subtitle">
                pero existen cuando estás con la persona correcta.
            </p>

            <div id="introReveal" class="reveal">

                <span class="reveal-line"></span>

                <p>
                    Y yo encontré el mío.
                </p>

                <strong>
                    Tú.
                </strong>

            </div>

            <button id="enterButton" class="enter-button">

                <span>
                    Entrar al universo
                </span>

                <b>
                    ✦
                </b>

            </button>

        </div>

        <!-- Indicador -->
        <div class="bottom-hint">

            <span class="hint-line"></span>

            <span>
                toca para comenzar
            </span>

        </div>

    </section>


    <!-- =====================================================
         UNIVERSO — TODAVÍA VACÍO
         Lo construiremos en el BLOQUE 2
    ====================================================== -->

    <section id="universe" class="universe">

        <div class="universe-placeholder">

            <span>
                ✦
            </span>

            <p>
                Nuestro pequeño universo
            </p>

        </div>

    </section>


    <!-- =====================================================
         MÚSICA
    ====================================================== -->

    <audio
        id="backgroundMusic"
        loop
        preload="auto"
    >
        <source
            src="assets/music/our-song.mp3"
            type="audio/mpeg"
        >
    </audio>


    <script src="js/app.js"></script>

</body>
</html>
